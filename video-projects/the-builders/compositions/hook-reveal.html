<template>

        repeating-linear-gradient(0deg, rgba(243,241,232,0.05) 0px, rgba(243,241,232,0.05) 1px, transparent 1px, transparent 64px),
        repeating-linear-gradient(90deg, rgba(243,241,232,0.05) 0px, rgba(243,241,232,0.05) 1px, transparent 1px, transparent 64px);

    .hr-square {
      position: absolute;

    }

    .hr-draw {
      width: 900px;

    .hr-draw path {
      fill: none;

      stroke-linejoin: round;
    }
    .hr-draw .fault {

    }
    .hr-title-wrap {
      position: absolute;
      inset: 0;

      align-items: center;
      justify-content: center;
      gap: 26px;
    }
    .hr-title {
      font-size: 148px;
      font-weight: 700;
      letter-spacing: -0.02em;

    }
    .hr-stamp-ring {

      opacity: 0;
    }
  </style>

  <div id="scene-hook" data-composition-id="scene-hook" data-width="1920" data-height="1080">
    <div class="hr-grid"></div>
    <div class="hr-square">
      <svg width="100%" height="100%" viewBox="0 0 100 100">
        <path d="M2 98 L2 2 L98 2" fill="none" stroke="var(--color-ink)" stroke-width="2"></path>
        <path d="M2 50 L50 50 L50 2" fill="none" stroke="var(--color-ink)" stroke-width="1"></path>
      </svg>
    </div>

    <div class="hr-stage">
      <svg class="hr-draw" viewBox="0 0 900 460">
        <!-- the real foundation + structure the video keeps -->
        <path id="p-foundation" d="M120 400 L780 400" />
        <path id="p-wall-l" d="M160 400 L160 220" />
        <path id="p-wall-r" d="M740 400 L740 150" />
        <path id="p-mid" d="M440 400 L440 260" />
        <path id="p-roofline" d="M160 220 L440 180 L740 150" />
        <path id="p-tower" d="M620 150 L620 90 L860 90 L860 400" />
        <!-- a false start that gets struck through, selling "hard to build" -->
        <path id="p-fault" class="fault" d="M160 400 L160 320 L340 320" />
      </svg>
      <div class="hr-pen" id="hr-pen"></div>
    </div>

    <div class="hr-title-wrap">
      <div class="hr-stamp-ring" id="hr-ring"></div>
      <div class="hr-title" id="hr-title">THE<br />BUILDERS</div>
    </div>
  </div>

  <script>
    (function () {
      const root = document.getElementById('scene-hook');
      const paths = {
        foundation: root.querySelector('#p-foundation'),
        wallL: root.querySelector('#p-wall-l'),
        wallR: root.querySelector('#p-wall-r'),
        mid: root.querySelector('#p-mid'),
        roofline: root.querySelector('#p-roofline'),
        tower: root.querySelector('#p-tower'),
        fault: root.querySelector('#p-fault'),
      };
      const lens = {};
      Object.keys(paths).forEach((k) => {
        const len = paths[k].getTotalLength();
        lens[k] = len;
        paths[k].style.strokeDasharray = len;
        paths[k].style.strokeDashoffset = len;
      });

      const tl = gsap.timeline({ paused: true });

      // Hook (0 - 2.5s): the foundation line draws itself, a pen dot riding it.
      tl.set('#hr-pen', { opacity: 1, x: 0 }, 0);
      tl.to(paths.foundation, { strokeDashoffset: 0, duration: 1.6, ease: 'power1.inOut' }, 0.15);
      tl.to(
        '#hr-pen',
        { x: 780 - 120, duration: 1.6, ease: 'power1.inOut' },
        0.15,
      );

      // a false, struck-through start (the old way failing on screen)
      tl.to(paths.fault, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 1.9);
      tl.to(paths.fault, { opacity: 0, duration: 0.3, ease: 'power2.in' }, 2.6);

      // Tension (2.5 - 6.5s): the real structure sketches in, fast and urgent.
      tl.to('#hr-pen', { opacity: 0, duration: 0.2 }, 2.55);
      tl.to(paths.wallL, { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, 2.8);
      tl.to(paths.wallR, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.out' }, 3.2);
      tl.to(paths.mid, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.out' }, 3.75);
      tl.to(paths.roofline, { strokeDashoffset: 0, duration: 0.7, ease: 'power2.out' }, 4.15);
      tl.to(paths.tower, { strokeDashoffset: 0, duration: 0.8, ease: 'power2.out' }, 4.8);

      // every stroke drawn so far gets a confident accent pass (the structure "takes")
      tl.to(
        [paths.foundation, paths.wallL, paths.wallR, paths.mid, paths.roofline, paths.tower],
        { stroke: '#7fae5c', duration: 0.35, ease: 'power2.inOut' },
        5.9,
      );
      tl.to(
        [paths.foundation, paths.wallL, paths.wallR, paths.mid, paths.roofline, paths.tower],
        { stroke: '#f3f1e8', duration: 0.5, ease: 'power2.inOut' },
        6.5,
      );

      // Reveal (6.5 - 9s): the structure recedes to a backdrop so the stamped
      // title has clean space, then the stamp ring and title land with weight.
      tl.to('.hr-stage', { opacity: 0.22, scale: 0.92, duration: 0.4, ease: 'power2.inOut' }, 6.6);
      tl.fromTo(
        '#hr-ring',
        { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.3, ease: 'power3.in' },
        6.7,
      );
      tl.fromTo(
        '#hr-title',
        { opacity: 0, scale: 1.18, filter: 'blur(4px)' },
        { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.42, ease: 'back.out(1.6)' },
        6.85,
      );
      tl.to('#hr-ring', { opacity: 0, duration: 0.3, ease: 'power2.out' }, 7.4);

      window.__timelines = window.__timelines || {};
      window.__timelines['scene-hook'] = tl;
    })();
  </script>
