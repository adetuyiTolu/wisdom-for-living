<template>
  <style>
    #root {
      position: absolute;

    }
    .bh-ink {
      position: absolute;
      width: 340px;
      height: 200px;
      border-radius: 4px;
      background: var(--color-accent);
      opacity: 0;
    }
    .bh-ink-label {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;

      color: var(--color-ground);
      opacity: 0;
    }
  </style>

  <div id="scene-hook" data-composition-id="scene-hook" data-width="1920" data-height="1080">
    <div class="bh-case"></div>
    <div class="bh-ink" id="bh-ink" style="left: 790px; top: 440px;">
      <div class="bh-ink-label" id="bh-ink-label" style="left: 40px; top: 86px;">Wisdom Press</div>
    </div>

    <!-- scattered type blocks (the tension beat: ideas not yet set) -->
    <div class="bh-block" id="blk-1" style="left: 420px; top: 220px;"></div>
    <div class="bh-block" id="blk-2" style="left: 1500px; top: 760px;"></div>
    <div class="bh-block" id="blk-3" style="left: 1620px; top: 260px;"></div>
    <div class="bh-block" id="blk-4" style="left: 300px; top: 740px;"></div>
    <div class="bh-block" id="blk-5" style="left: 940px; top: 150px;"></div>
    <div class="bh-block" id="blk-6" style="left: 980px; top: 840px;"></div>

    <div class="bh-stage">
      <div class="bh-word" id="bh-word">
        <span class="bh-letter">B</span><span class="bh-letter">O</span><span class="bh-letter">O</span><span class="bh-letter">K</span><span class="bh-letter">S</span>
      </div>
    </div>

    <div class="bh-byline-wrap">
      <div class="bh-byline" id="bh-byline">From Wisdom for Living</div>
    </div>
  </div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Hook (0 - 2.5s): a single press impression, already struck at frame 0
      // (the thumbnail frame) rather than entering from nothing.
      tl.set(['#bh-ink', '#bh-ink-label'], { opacity: 1 }, 0);
      tl.fromTo('#bh-ink', { scale: 1.15 }, { scale: 1, duration: 0.35, ease: 'power3.out' }, 0);
      tl.to(['#bh-ink', '#bh-ink-label'], { opacity: 0, duration: 0.5, ease: 'power2.in' }, 1.7);

      // Tension (2.5 - 6.5s): loose type scatters across the case, unsettled.
      const blocks = ['#blk-1', '#blk-2', '#blk-3', '#blk-4', '#blk-5', '#blk-6'];
      blocks.forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, scale: 0.6, rotation: i % 2 === 0 ? -8 : 8 },
          { opacity: 0.8, scale: 1, rotation: 0, duration: 0.35, ease: 'back.out(1.6)' },
          2.6 + i * 0.14,
        );
      });
      tl.to(blocks, { opacity: 0, duration: 0.3, ease: 'power2.in', stagger: 0.03 }, 5.9);

      // Reveal (6.5 - 9s): the word is set, letter by letter, with press weight.
      const letters = gsap.utils.toArray('#bh-word .bh-letter');
      letters.forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, y: -14, filter: 'blur(3px)' },
          { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.26, ease: 'back.out(2)' },
          6.6 + i * 0.09,
        );
      });
      tl.fromTo(
        '#bh-byline',
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: 'power2.out' },
        7.6,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines['scene-hook'] = tl;
    })();
  </script>
