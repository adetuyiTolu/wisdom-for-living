<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Background","default":"#101209"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#f3f1e8"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#7fae5c"},
    {"id":"font-display","type":"string","label":"Display font","default":"Space Grotesk"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('assets/fonts/space-grotesk.woff2') format('woff2');
        font-weight: 500 700;
        font-style: normal;
      }
      :root {
        --color-ground: #101209;
        --color-ink: #f3f1e8;
        --color-accent: #7fae5c;
        --font-display: 'Space Grotesk';
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        font-family: var(--font-display), sans-serif;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j7pz"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-p2e0"
        id="hook-reveal"
        class="clip"
        data-composition-id="hook-reveal"
        data-composition-src="compositions/hook-reveal.html"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-kx8n"
        id="proof"
        class="clip"
        data-composition-id="proof"
        data-composition-src="compositions/proof.html"
        data-start="8"

        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div data-hf-id="hf-yvrs"
        id="payoff-endcard"

        data-width="1920"
        data-height="1080"

      <audio data-hf-id="hf-w8z3"

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
